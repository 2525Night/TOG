<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>MoneyTail</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #15202b;
        --ink: #e8eef4;
        --mute: #9aa8b5;
        --mint: #7db8a8;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Segoe UI", Tahoma, sans-serif;
        background: radial-gradient(circle at 30% 20%, #243447, var(--bg));
        color: var(--ink);
        padding: 1.5rem;
        text-align: center;
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.6rem;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0;
        color: var(--mute);
        line-height: 1.5;
        max-width: 28rem;
      }
      .mark {
        width: 3rem;
        height: 3rem;
        border: 3px solid var(--mint);
        border-radius: 999px;
        margin: 0 auto 1rem;
      }
    </style>
  </head>
  <body>
    <div>
      <div class="mark" aria-hidden="true"></div>
      <h1>MoneyTail</h1>
      <p>
        מעטפת אנדרואיד (MTail3). בדרך כלל האפליקציה נטענת מהשרת המקומי /
        הפרודקשן דרך Capacitor — המסך הזה מופיע רק אם אין כתובת שרת.
      </p>
    </div>
  </body>
</html>
