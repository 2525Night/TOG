# fly.toml — MoneyTail5 API (SQLite on persistent volume for MVP remote)
app = 'moneytail-api'
primary_region = 'fra'

[build]
  dockerfile = 'Dockerfile'

[env]
  API_PORT = '3001'
  NODE_ENV = 'production'
  DATABASE_URL = 'file:/data/prod.db'

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '20s'
    timeout = '5s'
    grace_period = '45s'
    method = 'GET'
    path = '/api/health'

[mounts]
  source = 'moneytail_data'
  destination = '/data'

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1
